      function placeNums() {
    
        // -------------------------------
        // READ URL PARAMETERS
        // -------------------------------
        const params = new URLSearchParams(window.location.search);
    
        store      = params.get("store")      || "";
        faveNums   = params.get("faveNums")   || "";
        pronoun    = params.get("pronoun")    || "";
        lastFour   = params.get("lastFour")   || "";
        //phonePlays = Number(params.get("phonePlays") || 0);
        lastReset  = Number(params.get("lastReset")  || 0);
        let playsRaw  = params.get("plays") || "";
        user = params.get("user") || "";
        const pp = params.get("phonePlays");
        if (pp !== null) {
            phonePlays = Number(pp);
        }

        console.log("Screen5 params:", {
          faveNums, pronoun, lastFour, store, phonePlays, lastReset, playsRaw
        });
    
        // -------------------------------

        // -------------------------------
        //lastReset = Date.now();
    
        //console.log("Updated lastReset =", lastReset);
    
        // -------------------------------
        // SET NEXT SCREEN LINK
        // -------------------------------
        document.getElementById('nextScreenHREF').href =
          "Screen1.html?" +
          "store=" + encodeURIComponent(store) +
          "&faveNums=" + encodeURIComponent(faveNums) +
          "&pronoun=" + encodeURIComponent(pronoun) +
          "&lastFour=" + encodeURIComponent(lastFour) +
          "&phonePlays=" + phonePlays +
          "&lastReset=" + lastReset +
          "&plays=" + playsRaw;
