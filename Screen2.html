<!DOCTYPE html>

    <script>
      function loadPara(file, elementId, store) {
        var xhr = new XMLHttpRequest();
        var fileContent = '';
        xhr.open('GET', file, true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            fileContent = xhr.responseText || '[empty]';
            if (elementId == 'Screen2Para1' || elementId == 'Screen2Para3') {
              // do your replacements here
              if (store == 1) {
                fileContent = fileContent.replace(/CVS/g, 'SHEETZ');
              } else if (store == 2) {
                // leave it as it is ... this is CVS
              } else if (store == 3) {
                fileContent = fileContent.replace(/CVS/g, 'Coen');
              } else if (store == 4) {
                fileContent = fileContent.replace(/CVS/g, 'Primero');
              } else {
                fileContent = fileContent.replace(/CVS/g, '&lt;store&gt;');
              }
            }
            document.getElementById(elementId).innerHTML = fileContent;
          }
        };
        xhr.send();
      }
      
      function getTextFiles() {
        let anchorSearch = "";
        const params = new URLSearchParams(window.location.search);
        const incr = Number(params.get("incr") || 0);
        const lastFour = params.get("lastFour") || "";
        const store = params.get("store") || "";
        const pronoun = params.get("pronoun") || "";
        const phonePlays = Number(params.get("phonePlays") || 0);
        const faveNums = params.get("faveNums") || "";
        const playDiv = document.getElementById('exceededPlays');
        let   lastReset = Number(params.get("lastReset") || 0);
        let   playsRaw  = params.get("plays") || "";
        
        loadPara('Screen2Para1.txt', 'Screen2Para1', store);
        loadPara('Screen2Para2.txt', 'Screen2Para2', store);
        loadPara('Screen2Para3.txt', 'Screen2Para3', store);
        loadPara('Screen2Para4.txt', 'Screen2Para4', store);
        loadPara('Screen2Para5.txt', 'Screen2Para5', store);
        loadPara('Screen2Para6.txt', 'Screen2Para6', store);
        loadPara('Screen2Para7.txt', 'Screen2Para7', store);

        anchorSearch =
              "?faveNums=" + encodeURIComponent(faveNums) +
              "&store=" + encodeURIComponent(store) +
              "&pronoun=" + encodeURIComponent(pronoun) +
              "&lastFour=" + encodeURIComponent(lastFour) +
              "&phonePlays=" + phonePlays +
              "&lastReset=" + lastReset +
              "&incr=" + incr + 
              "&plays=" + playsRaw;
        document.getElementById('screen3HREF').href = "Screen3.html" + anchorSearch;
      }
    </script>
