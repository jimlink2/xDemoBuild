<body>
    <div id="container" class="container-fluid"></div>
    <script src="https://unpkg.com/react/umd/react.production.min.js" crossorigin></script>

    <script src="https://unpkg.com/react-dom/umd/react-dom.production.min.js" crossorigin></script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>


    <script>var Alert = ReactBootstrap.Alert;</script>
    <script src="/dist/passwordReset.js"></script>
    <script src="/dist/sizing.js"></script>
    <script>

        $(document).ready(function () {
            document.getElementById("submit").addEventListener("click", async function (event) {
                event.preventDefault();
                const pass = document.getElementById("pass").value;
                const pass2 = document.getElementById("pass2").value;
                if (pass !== pass2) {
                    console.log('error');
                    alert('passwords must match');
                    return false;
                }
                const email = document.getElementById('email').value;
                const msgUint8 = new TextEncoder().encode(pass); // encode as (utf-8) Uint8Array
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8); // hash the message
                const hashArray = Array.from(new Uint8Array(
                    hashBuffer)); // convert buffer to byte array
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join(
                    ''); // convert bytes to hex string
                let pathParts = window.location.pathname.split('/');
                $('#ghost_email').val(email);
                $('#ghost_pass').val(hashHex);
                $('#ghost_hash').val(pathParts[3]);
                $('#ghost').submit();
            });
        });
    </script>
