    <script>
      let demoHoldTimer = null;
      const DEMO_HOLD_MS = 4000;     // 4 second hold
      let demoMode = false;
      let demoDigits = [7, 3, 1];
      let demoCode = "4444";
      let demoVideoList = [
          "477",
          "433",
          "411"
      ];

      let demoVideoIndex = 0;
      
      function playVideo(targetDiv, fileNum) {

          var holder = document.getElementById(targetDiv);

          var vid = document.createElement("video");

          vid.width = 180;
          vid.autoplay = true;
          vid.muted = true;
          vid.controls = false;

          var source = document.createElement("source");

          source.src = "./videos/" + fileNum + ".mp4";
          source.type = "video/mp4";

          vid.appendChild(source);

          holder.appendChild(vid);

          return vid;
      }

      function cancelDemoHold() {
          if (demoHoldTimer) {
              clearTimeout(demoHoldTimer);
              demoHoldTimer = null;
          }
      }

      function buildDemoDigits(displayDigits) {
          var returnDigits = "";
          for (var i = 0; i < displayDigits.length; i++) {
              returnDigits +=
                  "<img class='selectionCircle' src='./assets/img/Ball"
                   + displayDigits[i] + ".png'>";
          }
          return returnDigits;
      }

      function showDemoDigits(count) {
          var digitsToShow = demoDigits.slice(0, count).join("");

          document.getElementById("demoDigitsDisplay").innerHTML =
              "Hit No. " +
              buildDemoDigits(digitsToShow);
      }

      function startDemoHit() {
          var submittedNums = "";
          demoMode = true;

          document.getElementById("Screen1Container").style.display = "none";
          document.getElementById("demoScreen").style.display = "block";
          submittedNums = buildDemoDigits("731");
          document.getElementById("submittedNumber").innerHTML = "Submitted No. " + submittedNums;
          document.getElementById("demoDigitsDisplay").innerHTML = "";

          var v1 = playVideo("demoVideo1", 477);

          v1.onended = function () {
              showDemoDigits(1);

              var v2 = playVideo("demoVideo2", 433);

              v2.onended = function () {
                  showDemoDigits(2);

                  var v3 = playVideo("demoVideo3", 411);

                  v3.onended = function () {
                      showDemoDigits(3);
                  };
              };
          };
      }
     
      function startDemoHold() {
          if (demoHoldTimer) return;
          
          demoHoldTimer = setTimeout(() => {
              demoHoldTimer = null;
              const code = prompt("Enter Demo Code");
              if (code === demoCode) {
                  startDemoHit();
              }
          }, DEMO_HOLD_MS);
      }
       
      function setupDemoMode() {
        const imgDiv = document.getElementById("store_img_div");
        if (!imgDiv) return;
        imgDiv.addEventListener("pointerdown", startDemoHold);
        imgDiv.addEventListener("pointerup", cancelDemoHold);
        imgDiv.addEventListener("pointerleave", cancelDemoHold);
        imgDiv.addEventListener("pointercancel", cancelDemoHold);
      }

      function getSearchInfo() {
        //var searchStr = window.location.search;
        let anchorSearch = "";
        const params = new URLSearchParams(window.location.search);
        const incr = Number(params.get("incr") || 0);
        const lastFour = params.get("lastFour") || "";
        const store = params.get("store") || "";
        const pronoun = params.get("pronoun") || "";
        const phonePlays = Number(params.get("phonePlays") || 0);
        const faveNums = params.get("faveNums") || "";
        const playDiv = document.getElementById('exceededPlays');
        let   lastReset = Number(params.get("lastReset") || 0);
        let   playsRaw  = params.get("plays") || "";
        console.log("lastReset A is " + lastReset);
        
        if (!lastReset) {
            lastReset = Date.now();   // initialize virtual day
        }
        console.log("lastReset B is " + lastReset);

        console.log("Screen1 params:", { incr, store, lastFour, lastReset, pronoun, phonePlays, faveNums, playsRaw });

        if (params.toString() !== "") {
        //if (searchStr != '') {
          //var exceededPlays = searchStr.indexOf("playsExceeded");
          const exceededPlays = Number(params.get("playsExceeded") || 0);
          if (exceededPlays > 0) {
            anchorSearch = '';
            playDiv.style.visibility = 'visible';
            playDiv.style.display = 'block';
          } else {
            //var anchorSearch = "?tenDigit=" + tenDigit + "&faveNums=" + faveNums + "&pronoun=" + pronoun;
            anchorSearch =
              "?faveNums=" + encodeURIComponent(faveNums) +
              "&store=" + encodeURIComponent(store) +
              "&pronoun=" + encodeURIComponent(pronoun) +
              "&lastFour=" + encodeURIComponent(lastFour) +
              "&phonePlays=" + phonePlays +
              "&lastReset=" + lastReset +
              "&incr=" + incr +
              "&plays=" + playsRaw;
            playDiv.style.visibility = 'hidden';
            playDiv.style.display = 'none';
            if (store == 1) {
              document.getElementById('store_name2').src = "./assets/img/Sheetz.jpg";
            } else if (store == 2) {
              document.getElementById('store_name2').src = "./assets/img/CVS.png";
            } else if (store == 3) {
              document.getElementById('store_name2').src = "./assets/img/Coen.png";
            } else if (store == 4) {
              document.getElementById('store_name2').src = "./assets/img/Primero.png";
            } else {
              document.getElementById('store_name2').src = "./assets/img/Generic.png";
            }
          }
        } else {
          anchorSearch = '';
          playDiv.style.visibility = 'hidden';
          playDiv.style.display = 'none';
        }
        document.getElementById('screen2HREF').href = "Screen2.html" + anchorSearch;
        document.getElementById('screen3HREF').href = "Screen3.html" + anchorSearch;
//        if (anchorSearch == '') {
//          var timeoutId = setTimeout(showAd, 30000);
//        }
        setupDemoMode();
      }
      
//      function showAd() {
//        window.location.href = "showAd.html";
//      }
    </script>
</head>
