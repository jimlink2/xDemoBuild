    <script>
      function hexify(s) {
          let r = [];
          for (let i = 0; i < s.length - 1; i += 2) {
              r.push(String.fromCharCode(parseInt(s.charAt(i) + s.charAt(i + 1), 16)));
          }
          return r.join("");
      }
      function getCookie(cname) {
          var name = cname + "=";
          var ca = document.cookie.split(';');
          for (var i = 0; i < ca.length; i++) {
              var c = ca[i];
              while (c.charAt(0) == ' ') {
                  c = c.substring(1);
              }
              if (c.indexOf(name) == 0) {
                  return c.substring(name.length, c.length);
              }
          }
          return "";
      }
      //let players = getCookie("players");
      let players = localStorage.getItem("players");
      //console.log(`players in admin: `, players);
      document.getElementById("playerTable").innerHTML = decodeURIComponent(players);
    </script>
